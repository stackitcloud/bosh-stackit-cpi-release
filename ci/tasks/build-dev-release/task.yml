platform: linux
image_resource:
  type: registry-image
  source:
    repository: registry.onstackit.cloud/scf-images/stackit-cf-deployment-concourse-tasks
    username: ((harbor.username))
    password: ((harbor.password))
    tag: v0.0.23
container_limits:
  cpu: 2
  memory: 1gb
inputs:
  - name: repo
outputs:
  - name: builds
params:
  VERSION:
  PRIVATE_YML:
run:
  path: repo/ci/tasks/build-dev-release/task.sh

