platform: linux
image_resource:
  type: registry-image
  source:
    repository: registry.onstackit.cloud/scf-images/stackit-cf-deployment-concourse-tasks
    username: ((harbor.username))
    password: ((harbor.password))
    tag: v0.0.23
container_limits:
  cpu: 2
  memory: 1gb
inputs:
  - name: repo
params:
  GH_TOKEN:
  TARGET_BRANCH:
  SOURCE_BRANCH:
  TITLE:
  BODY:
run:
  path: repo/ci/tasks/create-pr/task.sh

