meta:
- &state_file_path "data/bosh-state.json"
- &creds_file_path "data/bosh-creds.yml"
- &bosh_rc_file_path "data/bosh.rc"
- &bosh_resource_file_path "data/bosh-resource.yml"
- &tf_output_data_path "data/tf_output_data"


groups:
- name: dependency-bumps
  jobs:
  - bump-bosh-package-golang-release
- name: units
  jobs:
  - unit-test
- name: end-to-end
  jobs:
  - integration-test
  - build-dev-release
  - test-create-env
  - test-dummy-deployment
  - merge-pr
- name: cut-release
  jobs:
  - cut-release

- name: version
  jobs:
  - bump-version-major
  - bump-version-minor
  - bump-version-patch

jobs:
#---- version bump jobs ----
- name: bump-version-major
  serial: true
  plan:
  - put: stackit-cpi-release-version

- name: bump-version-minor
  serial: true
  plan:
  - put: stackit-cpi-release-version
    params: {bump: minor}

- name: bump-version-patch
  serial: true
  plan:
  - put: stackit-cpi-release-version
    params: {bump: patch}

- name: cut-release
  plan:
  - in_parallel:
    - get: bosh-stackit-cpi-release-test-release
    - get: bosh-stackit-cpi-release-develop
    - get: stackit-cpi-release-version
      params: {bump: patch}
  - load_var: release-version
    file: stackit-cpi-release-version/version
    format: trim
  - task: create-final-release
    file: bosh-stackit-cpi-release-develop/ci/tasks/create-final-release/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-develop
    params:
      GH_TOKEN: ((github_user.password))
      GIT_USER: ((github_user.username))
      GIT_EMAIL: cloudfoundry@stackit.cloud
      VERSION: ((.:release-version))
      PRIVATE_YML: ((bosh-stackit-cpi-release-blobstore-creds))
  - put: bosh-stackit-cpi-release-bucket
    params:
      acl: public-read
      file: builds/bosh-stackit-cpi-release-*.tgz
  - put: bosh-stackit-cpi-release-develop-write
    params: { repository: repo, branch: develop, rebase: true, tag: builds/tag-for-release }
  - put: bosh-stackit-cpi-release-final-release
    params:
      name: builds/tag-for-release
      tag: builds/tag-for-release
      commitish: bosh-stackit-cpi-release-develop-write/.git/HEAD
      generate_release_notes: true
      globs: [ builds/bosh-stackit-cpi-release-*.tgz ]
  - put: bosh-stackit-cpi-release-bucket
    params:
      file: builds/bosh-stackit-cpi-release-*.tgz
      acl: public-read
  - task: create-pr
    file: bosh-stackit-cpi-release-develop/ci/tasks/create-pr/task.yml
    params:
      GH_TOKEN: ((github_user.password))
      TARGET_BRANCH: main
      SOURCE_BRANCH: develop
      TITLE: publish release ((.:release-version))
      BODY: |
        this PR comes with a paired `drafted` release. Check the created release notes. If everything is okay:

        - merge this pr
        - go to the releases page and undraft the final release
    on_success:
      put: stackit-cpi-release-version
      params: {file: stackit-cpi-release-version/version}


#---- dependency bump jobs ----
- name: bump-bosh-package-golang-release
  serial: true
  plan:
  - in_parallel:
    - get: bosh-package-golang-release
      trigger: true
  - in_parallel:
    - load_var: current_tag
      file: bosh-package-golang-release/.git/ref
      format: trim
    - task: get-go-version-from-package-release
      config:
        platform: linux
        image_resource:
          type: registry-image
          source:
            repository: ghcr.io/cloudfoundry/bosh/golang-release
            tag: latest
        inputs:
        - name: bosh-package-golang-release
        outputs:
        - name: go-version

        run:
          path: bash
          args:
          - -c
          - |
            #!/usr/bin/env bash
            set -ex
            cat bosh-package-golang-release/config/blobs.yml | grep -v '^ '|sed 's/go\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/g' | sort -u | tail -1 > go-version/version

  - load_var: current_go_version
    file: go-version/version
  - get: bosh-stackit-cpi-release-develop

  - task: bump-vendored-golang-release
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: schwarzit-xx-sit-appcloud-docker-local.jfrog.io/stackit-cf-deployment-concourse-tasks
          username: ((jfrog_user))
          password: ((jfrog_password))
          tag: v0.0.19
      inputs:
      - name: bosh-package-golang-release
      - name: bosh-stackit-cpi-release-develop
      - name: go-version
      outputs:
      - name: bosh-stackit-cpi-release-develop-output
      params:
        GOLANG_VERSION: ((.:current_go_version))
        PACKAGE_RELEASE_TAG: ((.:current_tag))
        PRIVATE_YML: ((bosh-stackit-cpi-release-blobstore-creds))
        EMAIL: "cloudfoundry@stackit.cloud"
        GH_TOKEN: ((github_user.password))
      run:
        path: bash
        args:
        - -c
        - |
            #!/usr/bin/env bash
            set -e

            cp -R bosh-stackit-cpi-release-develop/. bosh-stackit-cpi-release-develop-output

            pushd bosh-stackit-cpi-release-develop-output
              # avoid dealing with changing github host keys...
              git remote set-url origin https://github.com/stackitcloud/bosh-stackit-cpi-release

              #ensure bucket region is set
              yq -i  '.blobstore.options.region |= "eu01"' config/final.yml
              echo -e "${PRIVATE_YML}" > config/private.yml
              git config --global user.name "stackit-cloudfoundry"
              # check if branch exists
              gh auth setup-git
              git fetch origin  '+refs/heads/*:refs/remotes/origin/*'
              git checkout "origin/bump-golang-to-${GOLANG_VERSION}" || git checkout -b "bump-golang-to-${GOLANG_VERSION}"

              go mod edit -go "${GOLANG_VERSION}" src/stackit-cpi/go.mod

              bosh vendor-package "golang-1-linux" "../bosh-package-golang-release"
              bosh vendor-package "golang-1-darwin" "../bosh-package-golang-release"


              git add .

              # ensure we're accidentially adding private.yml, it's in gitignore, but that can break...
              if git status | grep 'private.yml'; then
                exit 1
              fi

              if git status | grep 'nothing to commit'; then
                exit 0
              fi

              git commit -m "bump vendored golang to bosh-package-golang-release ${PACKAGE_RELEASE_TAG} containing go version: ${GOLANG_VERSION}"
            popd

  - put: bosh-stackit-cpi-release-out
    params: { repository: bosh-stackit-cpi-release-develop-output , branch: "bump-golang-to-((.:current_go_version))"}
  - task: create-pr
    file: bosh-stackit-cpi-release-develop/ci/tasks/create-pr/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-develop-output
    params:
      GH_TOKEN: ((github_user.password))
      TARGET_BRANCH: develop
      SOURCE_BRANCH: bump-golang-to-((.:current_go_version))
      TITLE: bump-golang-to-((.:current_go_version))
      BODY: |
        bump vendored golang package release to version ((.:current_tag))
        bump vendored golang to version: ((.:current_go_version))

#---- test jobs ----
- name: integration-test
  plan:
  - get: bosh-stackit-cpi-release-pull-request-approved
    trigger: true
  - task: integration-test
    attempts: 3
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/integration-test/task.yml
    params:
      TEST_CONFIG: ((integration-creds))
    on_success:
      put: bosh-stackit-cpi-release-pull-request
      params:
        path: bosh-stackit-cpi-release-pull-request-approved
        status: success
        context: integration-test

- name: unit-test
  serial: true
  plan:
  - in_parallel:
    - get: concourse-pipelines
      trigger: true
    - get: bosh-package-golang-release
    - get: bosh-stackit-cpi-release-develop
      trigger: true
    - get: bosh-stackit-cpi-release-pull-request
      trigger: true

  - in_parallel:
  # - put: bosh-stackit-cpi-release-pull-request
  #   params:
  #     path: bosh-stackit-cpi-release-pull-request
  #     status: pending
    - task: unit-test
      file: bosh-stackit-cpi-release-pull-request/ci/tasks/unit-test/task.yml
      input_mapping:
        repo: bosh-stackit-cpi-release-pull-request
      attempts: 1
      container_limits:
        memory: 0
      on_success:
        put: bosh-stackit-cpi-release-pull-request
        params:
          path: bosh-stackit-cpi-release-pull-request
          status: success
          context: unit-tests
    - task: gosec
      file: bosh-stackit-cpi-release-pull-request/ci/tasks/gosec/task.yml
      input_mapping:
        repo: bosh-stackit-cpi-release-pull-request
      params:
        GOSEC_VERSION: v2.22.11 # stay on v2.22 because of https://github.com/securego/gosec/issues/1500
      attempts: 1
      container_limits:
        memory: 0
      on_success:
        put: bosh-stackit-cpi-release-pull-request
        params:
          path: bosh-stackit-cpi-release-pull-request
          status: success
          context: gosec
    - task: golvulncheck
      file: bosh-stackit-cpi-release-pull-request/ci/tasks/govulncheck/task.yml
      input_mapping:
        repo: bosh-stackit-cpi-release-pull-request
      attempts: 1
      container_limits:
        memory: 0
      on_success:
        put: bosh-stackit-cpi-release-pull-request
        params:
          path: bosh-stackit-cpi-release-pull-request
          status: success
          context: govulnsec

- name: build-dev-release
  serial_groups: [ director_redeployment ]
  plan:
  - in_parallel:
    - get: bosh-stackit-cpi-release-pull-request-approved
      passed: [ integration-test ]
      trigger: true
    - put: stackit-cpi-release-version
      params: {pre: alpha}
  - load_var: dev-release-version
    file: stackit-cpi-release-version/version
    format: trim
  - file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/build-dev-release/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    params:
      GIT_REPO: https://github.com/stackitcloud/bosh-stackit-cpi-release
      GIT_USER: ((github_user.username))
      GITHUB_TOKEN: ((github_user.password))
      VERSION: ((.:dev-release-version))
      PRIVATE_YML: ((bosh-stackit-cpi-release-blobstore-creds))
    task: build-dev-release

  - task: rename-tarball
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: schwarzit-xx-sit-appcloud-docker-local.jfrog.io/stackit-cf-deployment-concourse-tasks
          username: ((jfrog_user))
          password: ((jfrog_password))
          tag: v0.0.19
      outputs:
      - name: builds
      inputs:
      - name: builds
      run:
        path: bash
        args:
        - -c
        - |
          mv builds/dev.tgz builds/bosh-stackit-cpi-release-((.:dev-release-version)).tgz
  - put: bosh-stackit-cpi-release-test-release
    params:
      file: builds/bosh-stackit-cpi-release-((.:dev-release-version)).tgz
    on_success:
      put: bosh-stackit-cpi-release-pull-request
      params:
        path: bosh-stackit-cpi-release-pull-request-approved
        status: success
        context: create-release


- name: test-create-env
  serial: true
  serial_groups: [ director_redeployment ]
  plan:
  - in_parallel:
    - get: bosh-deployment
    - get: bosh-stackit-cpi-release-pull-request-approved
      trigger: true
      passed: [build-dev-release]
    - get: bosh-stackit-cpi-release-test-release
      trigger: true
      passed: [build-dev-release]
    - get: stackit-cpi-release-version
    - get: stackit-envs
    - get: prometheus-boshrelease
  - task: read-from-secretsmanager
    file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/read-from-secrets-manager/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    params:
      VAULT: ((vault))
      VALUES:
      - { "vault_path": "tf_output_data", value_path: *tf_output_data_path }
      - { "vault_path": "bosh-state", value_path: *state_file_path }
      - { "vault_path": "bosh-creds", value_path: *creds_file_path }
  - load_var: tf_output
    format: json
    file: "data/tf_output_data"

  - task: calc-sha1shum-for-release
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: schwarzit-xx-sit-appcloud-docker-local.jfrog.io/stackit-cf-deployment-concourse-tasks
          username: ((jfrog_user))
          password: ((jfrog_password))
          tag: v0.0.19
      inputs:
      - name: bosh-stackit-cpi-release-test-release
      outputs:
      - name: sha1sum
      run:
        path: bash
        args:
        - -c
        - |
          #!/usr/bin/env bash
          sha1sum bosh-stackit-cpi-release-test-release/bosh-stackit-cpi-release-*.tgz | awk '{print $1}' > sha1sum/value

  - load_var: cpi-url
    file: bosh-stackit-cpi-release-test-release/url
  - load_var: cpi-version
    file: bosh-stackit-cpi-release-test-release/version
  - load_var: cpi-sha1sum
    file: sha1sum/value

  - task: create-env
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/create-env/task.yml
    params:
      TERRAFORM_OUTPUT: ((.:tf_output))
      MANIFEST: ./bosh-deployment/bosh.yml
      OPS:
      - stackit-envs/ops-files/bosh/stackit-bucket-blobstore.yml
      - stackit-envs/ops-files/bosh/cpi.yml
      - stackit-envs/ops-files/bosh/dev-cpi.yml
      - bosh-deployment/uaa.yml
      - bosh-deployment/credhub.yml
      - bosh-deployment/jumpbox-user.yml
      - bosh-deployment/misc/dns-addon.yml
      - prometheus-boshrelease/manifests/operators/bosh/add-bosh-exporter-uaa-clients.yml
      VARS:
      - bosh_vm_flavor="c1a.4d"
      - root_disk_size="100"
      - stemcell_sha="bd7c524a720e120058068646b2f8cff2cbd23646"
      - stemcell_url="https://storage.googleapis.com/bosh-core-stemcells/1.134/bosh-stemcell-1.134-openstack-kvm-ubuntu-noble.tgz"
      - bosh-stackit-cpi-release-url=((.:cpi-url))
      - bosh-stackit-cpi-release-sha1=((.:cpi-sha1sum))
      - bosh-stackit-cpi-release-version=((.:cpi-version))
      VAR_FILES:
      - bosh-vars.json
      STATE_FILE_PATH: *state_file_path
      CREDS_FILE_PATH: *creds_file_path
      BOSH_RC_FILE_PATH: *bosh_rc_file_path
      BOSH_RESOURCE_FILE_PATH: *bosh_resource_file_path

    on_success:
      put: bosh-stackit-cpi-release-pull-request-approved
      params:
        path: bosh-stackit-cpi-release-pull-request-approved
        status: success
        context: create-env
  - task: write-bosh-state
    file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/write-to-secrets-manager/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    params:
      VAULT: ((vault))
      VALUES:
      - { "vault_path": "bosh-state", value_path: *state_file_path }
      - { "vault_path": "bosh-creds", value_path: *creds_file_path }
      - { "vault_path": "bosh-rc", value_path: *bosh_rc_file_path  }
      - { "vault_path": "bosh-resource-rc", value_path: *bosh_resource_file_path }

- name: test-dummy-deployment
  serial_groups: [ director_redeployment ]
  serial: true
  plan:
  - in_parallel:
    - get: stemcell
    - get: bosh-stackit-cpi-release-pull-request-approved
      passed: [ test-create-env ]
      trigger: true
    - get: bosh-stackit-cpi-release-test-release
      trigger: true
      passed: [ test-create-env ]
  - task: read-from-secretsmanager
    file: bosh-stackit-cpi-release-pull-request-approved/ci/tasks/read-from-secrets-manager/task.yml
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    params:
      VAULT: ((vault))
      VALUES:
      - { "vault_path": "bosh-resource-rc", value_path: *bosh_resource_file_path }

  - put: dummy-deployment
    params:
      source_file: *bosh_resource_file_path
      manifest: bosh-stackit-cpi-release-pull-request-approved/ci/assets/dummy-deployment.yml
      vars:
        stemcell_os: ubuntu-noble
        az: az-1
        vm_name: dummy
        vm_type: small
        net_name: runtime
      stemcells:
      - stemcell/*.tgz
    on_success:
      put: bosh-stackit-cpi-release-pull-request-approved
      params:
        path: bosh-stackit-cpi-release-pull-request-approved
        status: success
        context: create-dummy-deployment
  - put: dummy-deployment
    params:
      delete:
        enabled: true
      source_file: *bosh_resource_file_path
      manifest: bosh-stackit-cpi-release-pull-request-approved/ci/assets/dummy-deployment.yml
      vars:
        stemcell_os: ubuntu-noble
        az: az-1
        vm_name: dummy
        vm_type: small
        net_name: runtime
      stemcells:
      - stemcell/*.tgz
    on_success:
      put: bosh-stackit-cpi-release-pull-request-approved
      params:
        path: bosh-stackit-cpi-release-pull-request-approved
        status: success
        context: delete-dummy-deployment

- name: merge-pr
  plan:
  - get: bosh-stackit-cpi-release-pull-request-approved
    passed: [ test-dummy-deployment ]
    trigger: true
  - task: merge-pr
    input_mapping:
      repo: bosh-stackit-cpi-release-pull-request-approved
    config:
      platform: linux
      image_resource:
        type: registry-image
        source:
          repository: schwarzit-xx-sit-appcloud-docker-local.jfrog.io/stackit-cf-deployment-concourse-tasks
          username: ((jfrog_user))
          password: ((jfrog_password))
          tag: v0.0.19
      params:
        GH_TOKEN: ((github_user.password))
        EMAIL: "cloudfoundry@stackit.cloud"
      inputs:
      - name: repo
      run:
        path: bash
        args:
        - -c
        - |
          #!/usr/bin/env bash
          set -eo pipefail
          pushd repo || exit 1
            gh pr merge -r $(cat .git/resource/pr) -A "${EMAIL}" -F  .git/resource/body
          popd




resource_types:
- name: pull-request
  type: registry-image
  source:
    repository: cfcommunity/github-pr-resource
- name: bosh-deployment
  type: registry-image
  source:
    repository: cloudfoundry/bosh-deployment-resource

resources:
- name: stemcell
  type: bosh-io-stemcell
  source:
    name: bosh-openstack-kvm-ubuntu-noble
# we're using dynamic configuration: https://github.com/cloudfoundry/bosh-deployment-resource?tab=readme-ov-file#dynamic-source-configuration
- name: dummy-deployment
  type: bosh-deployment
  source:
    deployment: dummy-deployment
    skip_check: true
    client: fake
    client_secret: fake

- name: stackit-cpi-release-version
  type: semver
  source:
    driver: s3
    bucket: scf-cpi-prod
    key: bosh-stackit-cpi-version
    endpoint: object.storage.eu01.onstackit.cloud
    access_key_id: ((cpi-version-bucket-creds.access_key_id))
    secret_access_key: ((cpi-version-bucket-creds.secret_access_key))
    initial_version: 0.0.0

- name: bosh-stackit-cpi-release-bucket
  type: s3
  source:
    bucket: scf-cpi-prod
    endpoint: object.storage.eu01.onstackit.cloud
    regexp: releases/bosh-stackit-cpi-release-(.*).tgz
    access_key_id: ((cpi-version-bucket-creds.access_key_id))
    secret_access_key: ((cpi-version-bucket-creds.secret_access_key))

- name: bosh-package-golang-release
  source:
    password: ((github_user.password))
    uri: https://github.com/cloudfoundry/bosh-package-golang-release
    username: ((github_user.username))
    fetch_tags: true
    tag_regex: v.*
  type: git
- name: bosh-stackit-cpi-release-out
  source:
    password: ((github_user.password))
    uri: https://github.com/stackitcloud/bosh-stackit-cpi-release
    username: ((github_user.username))
  type: git
- name: bosh-stackit-cpi-release-develop-write
  source:
    branch: develop
    uri: git@github.com:stackitcloud/bosh-stackit-cpi-release
    private_key: ((release-publish-deploy-key.private_key))
  type: git
- name: bosh-stackit-cpi-release-develop
  source:
    branch: develop
    private_key: ((release-publish-deploy-key.private_key))
    uri: git@github.com:stackitcloud/bosh-stackit-cpi-release
    username: ((github_user.username))
    fetch_tags: true
  type: git
- name: bosh-stackit-cpi-release-pull-request
  source:
    access_token: ((github_user.password))
    base_branch: develop
    repository: stackitcloud/bosh-stackit-cpi-release
  type: pull-request
- name: bosh-stackit-cpi-release-pull-request-approved
  type: pull-request
  source:
    access_token: ((github_user.password))
    base_branch: develop
    repository: stackitcloud/bosh-stackit-cpi-release
    required_review_approvals: 1
- name: bosh-stackit-cpi-release-final-release
  source:
    drafts: true
    access_token: ((github_user.password))
    owner: stackitcloud
    repository: bosh-stackit-cpi-release
    release: false
  type: github-release
- name: bosh-stackit-cpi-release-test-release
  type: s3
  source:
    bucket: scf-cpi-prod
    endpoint: object.storage.eu01.onstackit.cloud
    regexp: test_releases/bosh-stackit-cpi-release-(.*).tgz
    access_key_id: ((cpi-version-bucket-creds.access_key_id))
    secret_access_key: ((cpi-version-bucket-creds.secret_access_key))
- name: concourse-pipelines
  source:
    branch: main
    password: ((azure-dev-token))
    uri: https://dev.azure.com/schwarzit/schwarzit.stackit-appcloud/_git/concourse-pipelines
    username: ((azure-dev-user))
  type: git
- name: stackit-envs
  type: git
  source:
    branch: main
    password: ((azure-dev-token))
    uri: https://schwarzit@dev.azure.com/schwarzit/schwarzit.stackit-appcloud/_git/scf-oss-c5-no-vendor
    username: ((azure-dev-user))
- name: bosh-deployment
  type: git
  source:
    uri: https://github.com/cloudfoundry/bosh-deployment
    username: ((github_user.username))
    password: ((github_user.password))
    branch: master
- name: prometheus-boshrelease
  type: git
  source:
    uri: https://github.com/cloudfoundry/prometheus-boshrelease.git
    username: ((github_user.username))
    password: ((github_user.password))
    branch: master
